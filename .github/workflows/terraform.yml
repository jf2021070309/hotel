name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Terraform Init
        working-directory: app/infra
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Plan
        working-directory: app/infra
        run: terraform plan ${{ github.event.inputs.action == 'destroy' && '-destroy' || '' }}
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}
          TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Terraform Apply / Destroy
        working-directory: app/infra
        run: terraform ${{ github.event.inputs.action }} -auto-approve
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}
          TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

      - name: Esperar MySQL
        if: ${{ github.event.inputs.action == 'apply' }}
        run: sleep 120

      - name: Seed Database
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: app/infra
        run: |
          PROXY_HOST=$(terraform output -raw mysql_proxy_domain | sed 's/\.$//')
          PROXY_PORT=$(terraform output -raw mysql_proxy_port)

          echo "Esperando handshake de MySQL en $PROXY_HOST:$PROXY_PORT"

          for i in {1..12}; do
            if mysqladmin ping -h "$PROXY_HOST" -P "$PROXY_PORT" -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} --protocol=TCP --silent; then
              echo "MySQL listo"
              break
            fi
            echo "Intento $i/12: MySQL aún no responde, esperando 10s..."
            sleep 10
          done

          mysql -h "$PROXY_HOST" -P "$PROXY_PORT" -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} --protocol=TCP hotel_db < hotel.sql
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}
          TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
name: Terraform Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acción a ejecutar'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Terraform Init
        working-directory: app/infra
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Inspect current state
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: app/infra
        run: terraform state list || true
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}

      - name: Clean inconsistent state
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: app/infra
        run: |
          terraform state rm railway_custom_domain.hotel || true
          terraform state rm cloudflare_record.hotel || true
          terraform state rm railway_project.hotel || true
          terraform state rm railway_service.app || true
          terraform state rm railway_service.mysql || true
          terraform state rm railway_tcp_proxy.mysql_proxy || true
          terraform state rm railway_variable.mysql_database || true
          terraform state rm railway_variable.mysql_database_app || true
          terraform state rm railway_variable.mysql_host || true
          terraform state rm railway_variable.mysql_password || true
          terraform state rm railway_variable.mysql_root_password || true
          terraform state rm railway_variable.mysql_user || true
          terraform state rm railway_variable.app_env || true
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}

      - name: Terraform Plan
        working-directory: app/infra
        run: terraform plan ${{ github.event.inputs.action == 'destroy' && '-destroy' || '' }}
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}

      - name: Terraform Apply / Destroy
        working-directory: app/infra
        run: terraform ${{ github.event.inputs.action }} -auto-approve
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}

      - name: Esperar MySQL
        if: ${{ github.event.inputs.action == 'apply' }}
        run: sleep 90

      - name: Seed Database
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: app/infra
        run: |
          PROXY_HOST=$(terraform output -raw mysql_proxy_domain)
          PROXY_PORT=$(terraform output -raw mysql_proxy_port)
          mysql -h "$PROXY_HOST" -P "$PROXY_PORT" -u root -p${{ secrets.MYSQL_ROOT_PASSWORD }} hotel_db < hotel.sql
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_railway_token: ${{ secrets.RAILWAY_TOKEN }}
          TF_VAR_mysql_root_password: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          TF_VAR_gh_repo: ${{ secrets.GH_REPO }}
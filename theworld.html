<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE WORLD ULTRA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --color-bg: #0a0a0f;
            --color-accent: #d4af37;
            --color-accent2: #7b2fff;
            --font-display: 'Cinzel', serif;
        }

        body {
            background: var(--color-bg);
            font-family: var(--font-display);
            color: white;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .btn-world {
            position: relative;
            z-index: 10;
            padding: 1.2rem 3rem;
            font-family: var(--font-display);
            font-size: clamp(1rem, 2vw, 1.4rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--color-accent);
            background: transparent;
            border: 2px solid var(--color-accent);
            cursor: pointer;
            clip-path: polygon(10px 0%, 100% 0%, calc(100% - 10px) 100%, 0% 100%);
            transition: all 0.3s ease;
        }

        .btn-world::before {
            content: '';
            position: absolute;
            inset: 0;
            background: var(--color-accent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-world:hover {
            color: #0a0a0f;
            box-shadow: 0 0 30px var(--color-accent), 0 0 60px var(--color-accent);
        }

        .btn-world:hover::before {
            opacity: 1;
        }

        .btn-world span {
            position: relative;
            z-index: 1;
        }

        .btn-world:hover span {
            color: #0a0a0f;
        }

        .flash {
            position: fixed;
            inset: 0;
            background: white;
            opacity: 0;
            z-index: 9000;
            pointer-events: none;
        }

        .wave {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            z-index: 9001;
            pointer-events: none;
            box-shadow: 0 0 0 4px white, 0 0 0 8px rgba(255, 255, 255, 0.4);
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(20, 0, 50, 0.6) 0%, rgba(0, 0, 0, 0.98) 70%);
            backdrop-filter: blur(8px);
            opacity: 0;
            z-index: 9002;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.visible {
            opacity: 1;
            pointer-events: all;
            animation: aura 3s ease-in-out infinite;
        }

        .text-main {
            font-size: clamp(3rem, 10vw, 7rem);
            letter-spacing: 12px;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 60px rgba(212, 175, 55, 0.3);
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .text-sub {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            letter-spacing: 20px;
            color: var(--color-accent);
            text-shadow: 0 0 20px var(--color-accent);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s;
        }

        .overlay.visible .text-main {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .overlay.visible .text-sub {
            opacity: 1;
            transform: translateY(0);
        }

        .timer-wrap {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0;
            transition: opacity 0.4s ease 0.6s;
        }

        .overlay.visible .timer-wrap {
            opacity: 1;
        }

        .timer-label {
            font-size: clamp(0.6rem, 1.5vw, 0.85rem);
            letter-spacing: 6px;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
        }

        .timer-num {
            font-size: clamp(2.5rem, 6vw, 5rem);
            color: white;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            text-shadow: 0 0 30px white;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .timer-num.tick {
            transform: scale(1.3);
            opacity: 0.5;
        }

        .cracks {
            position: fixed;
            inset: 0;
            z-index: 9003;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s ease;
        }

        .cracks.show {
            opacity: 1;
            animation: crackFade 1.2s ease-out forwards;
        }

        .resume-screen {
            position: fixed;
            inset: 0;
            z-index: 9010;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .resume-screen.show {
            opacity: 1;
            pointer-events: all;
        }

        .resume-text {
            font-size: clamp(1.5rem, 5vw, 4rem);
            letter-spacing: 8px;
            color: var(--color-accent2);
            text-shadow: 0 0 40px var(--color-accent2), 0 0 80px var(--color-accent2);
            animation: pulseGlow 0.8s ease-in-out infinite alternate;
        }

        @keyframes waveExpand {
            to {
                transform: translate(-50%, -50%) scale(300);
                opacity: 0;
            }
        }

        @keyframes crackFade {
            0% {
                opacity: 1;
            }

            60% {
                opacity: 0.8;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes aura {

            0%,
            100% {
                filter: hue-rotate(0deg) brightness(1);
            }

            50% {
                filter: hue-rotate(30deg) brightness(1.4);
            }
        }

        @keyframes shake {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            10% {
                transform: translate(-8px, -4px) rotate(-1deg);
            }

            20% {
                transform: translate(8px, 4px) rotate(1deg);
            }

            30% {
                transform: translate(-6px, 6px) rotate(-0.5deg);
            }

            40% {
                transform: translate(6px, -6px) rotate(0.5deg);
            }

            50% {
                transform: translate(-4px, 2px) rotate(-0.8deg);
            }

            60% {
                transform: translate(4px, -2px) rotate(0.8deg);
            }

            70% {
                transform: translate(-2px, 4px) rotate(-0.3deg);
            }

            80% {
                transform: translate(2px, -4px) rotate(0.3deg);
            }

            90% {
                transform: translate(-1px, 1px) rotate(-0.1deg);
            }
        }

        @keyframes pulseGlow {
            from {
                text-shadow: 0 0 20px var(--color-accent2);
            }

            to {
                text-shadow: 0 0 60px var(--color-accent2), 0 0 100px var(--color-accent2);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <canvas id="particles"></canvas>

    <button class="btn-world" id="btnWorld" onclick="timeStop()">
        <span>🕒 THE WORLD ULTRA</span>
    </button>

    <div class="flash" id="flash"></div>
    <div class="wave" id="wave"></div>

    <svg class="cracks" id="cracks" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice"
        xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g stroke="white" stroke-width="1.5" fill="none" opacity="0.7">
            <polyline points="720,450 680,380 640,300 700,200" />
            <polyline points="720,450 760,370 820,310 780,180" />
            <polyline points="720,450 650,500 580,560 500,620 420,700" />
            <polyline points="720,450 780,510 860,580 940,650 1020,750" />
            <polyline points="720,450 700,520 660,600 600,720 560,820" />
            <polyline points="720,450 750,530 780,640 810,780" />
            <polyline points="720,450 620,430 500,400 360,380 200,360" />
            <polyline points="720,450 840,440 980,420 1140,410 1300,400" />
            <polyline points="640,300 600,260 540,200 480,120" />
            <polyline points="780,180 820,130 880,80 940,20" />
            <polyline points="500,620 440,680 360,740 260,820" />
            <polyline points="1020,750 1080,800 1140,860" />
            <polyline points="200,360 120,320 60,280" />
            <polyline points="1300,400 1380,380 1440,360" />
        </g>
        <circle cx="720" cy="450" r="8" fill="white" opacity="0.9" />
        <circle cx="720" cy="450" r="20" stroke="white" stroke-width="2" fill="none" opacity="0.5" />
        <circle cx="720" cy="450" r="40" stroke="white" stroke-width="1" fill="none" opacity="0.25" />
    </svg>

    <div class="overlay" id="overlay">
        <div class="text-main">THE WORLD</div>
        <div class="text-sub">ZA WARUDO</div>
        <div class="timer-wrap">
            <div class="timer-label">Tiempo detenido</div>
            <div class="timer-num" id="timer">5</div>
        </div>
    </div>

    <div class="resume-screen" id="resumeScreen">
        <div class="resume-text">✦ EL TIEMPO CONTINÚA ✦</div>
    </div>

    <audio id="sound" src="assets/audio/jotaro.mp3" preload="auto"></audio>

    <script>
        const overlay = document.getElementById("overlay");
        const flash = document.getElementById("flash");
        const wave = document.getElementById("wave");
        const cracks = document.getElementById("cracks");
        const timerEl = document.getElementById("timer");
        const sound = document.getElementById("sound");
        const btnWorld = document.getElementById("btnWorld");
        const resumeScreen = document.getElementById("resumeScreen");
        const params = new URLSearchParams(window.location.search);
        const nextUrl = params.get("next");

        let freeze = false;
        let running = false;

        /* ── PARTÍCULAS ── */
        const canvas = document.getElementById("particles");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener("resize", resizeCanvas);

        const particles = Array.from({ length: 200 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            s: Math.random() * 2.5 + 0.5,
            vx: (Math.random() - 0.5) * 0.3,
            vy: Math.random() * 0.6 + 0.1,
            o: Math.random() * 0.7 + 0.3,
        }));

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (const p of particles) {
                if (!freeze) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.y > canvas.height) { p.y = -4; p.x = Math.random() * canvas.width; }
                }
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
                ctx.fillStyle = freeze
                    ? `rgba(212,175,55,${p.o * 0.6})`
                    : `rgba(255,255,255,${p.o})`;
                ctx.fill();
            }
            requestAnimationFrame(drawParticles);
        }
        drawParticles();

        /* ── HELPERS ── */
        function animateFlash() {
            flash.style.opacity = "1";
            flash.style.transition = "none";
            requestAnimationFrame(() => requestAnimationFrame(() => {
                flash.style.transition = "opacity 0.35s ease-out";
                flash.style.opacity = "0";
            }));
        }

        function animateWave() {
            wave.style.animation = "none";
            wave.style.opacity = "1";
            wave.style.transform = "translate(-50%, -50%) scale(1)";
            requestAnimationFrame(() => requestAnimationFrame(() => {
                wave.style.animation = "waveExpand 0.8s cubic-bezier(0.16,1,0.3,1) forwards";
            }));
        }

        function shakeBody() {
            document.body.style.animation = "none";
            requestAnimationFrame(() => requestAnimationFrame(() => {
                document.body.style.animation = "shake 0.5s ease-out";
                setTimeout(() => { document.body.style.animation = ""; }, 500);
            }));
        }

        function tickTimer() {
            timerEl.classList.add("tick");
            setTimeout(() => timerEl.classList.remove("tick"), 150);
        }

        /* ── MAIN ── */
        function timeStop() {
            if (running) return;
            running = true;
            btnWorld.disabled = true;

            animateFlash();
            animateWave();
            shakeBody();

            cracks.classList.remove("show");
            void cracks.offsetWidth;
            cracks.classList.add("show");

            sound.currentTime = 0;
            sound.play().catch(() => { });

            setTimeout(() => {
                overlay.classList.add("visible");
                freeze = true;

                let time = 5;
                timerEl.textContent = time;

                const interval = setInterval(() => {
                    time--;
                    tickTimer();
                    timerEl.textContent = time > 0 ? time : "✦";
                    if (time <= 0) { clearInterval(interval); setTimeout(endTimeStop, 400); }
                }, 1000);
            }, 300);
        }

        function endTimeStop() {
            overlay.classList.remove("visible");
            setTimeout(() => {
                resumeScreen.classList.add("show");
                shakeBody();
                setTimeout(() => {
                    resumeScreen.classList.remove("show");
                    cracks.classList.remove("show");
                    freeze = false;
                    running = false;
                    btnWorld.disabled = false;
                    if (nextUrl) {
                        window.location.href = nextUrl;
                    }
                }, 1200);
            }, 400);
        }

        if (nextUrl) {
            btnWorld.style.display = "none";
            window.addEventListener("load", () => {
                setTimeout(() => timeStop(), 120);
            });
        }
    </script>
</body>

</html>

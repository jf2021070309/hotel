server {
    listen $PORT;
    root /app/public;
    index index.php;

    # Servir archivos estáticos directamente
    location / {
        try_files $uri $uri/ @rewrite;
    }

    location @rewrite {
        rewrite ^/habitaciones/?$          /app/Views/habitaciones/index.php last;
        rewrite ^/rooming/?$               /app/Views/rooming/index.php last;
        rewrite ^/reservas/?$              /app/Views/reservas/index.php last;
        rewrite ^/flujo/?$                 /app/Views/flujo/index.php last;
        rewrite ^/flujo/form/?$            /app/Views/flujo/form.php last;
        rewrite ^/flujo/dia/?$             /app/Views/flujo/dia.php last;
        rewrite ^/flujo/reporte-sobre/?$   /app/Views/flujo/reporte_sobre.php last;
        rewrite ^/flujo/reporte-alex-diario/?$ /app/Views/flujo/reporte_alex_diario.php last;
        rewrite ^/caja-chica/?$            /app/Views/caja_chica/index.php last;
        rewrite ^/sobres/?$                /app/Views/sobres/index.php last;
        rewrite ^/calculadora/?$           /app/Views/calculadora/index.php last;
        rewrite ^/yape/?$                  /app/Views/yape/index.php last;
        rewrite ^/inventario/?$            /app/Views/inventario/index.php last;
        rewrite ^/desayunos/?$             /app/Views/desayunos/index.php last;
        rewrite ^/limpieza/?$              /app/Views/limpieza/index.php last;
        rewrite ^/clientes/?$              /app/Views/clientes/index.php last;
        rewrite ^/clientes-frecuentes/?$   /app/Views/clientes/frecuentes.php last;
        rewrite ^/admin/usuarios/?$        /app/Views/admin/usuarios.php last;
        rewrite ^/admin/medios-pago/?$     /app/Views/admin/medios_pago.php last;
        rewrite ^/admin/auditoria/?$       /app/Views/admin/auditoria.php last;
        rewrite ^/reportes/mendoza/?$      /app/Views/reportes/mendoza.php last;
        rewrite ^/reportes/alex/?$         /app/Views/reportes/alex.php last;

        # Fallback al index
        rewrite ^ /index.php last;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }
}

name: Generar Documentación Técnica

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Permisos necesarios para desplregar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permite una sola ejecución simultánea de despliegue
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-docs:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurar PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Descargar phpDocumentor
      run: curl -L https://phpdoc.org/phpDocumentor.phar -o phpDocumentor.phar

    - name: Instalar JSDoc
      run: npm install -g jsdoc

    - name: Generar Documentación Backend (PHP)
      run: php phpDocumentor.phar -d app/ -d api/ -t docs/php-api --title "Hotel Manager Backend"

    - name: Generar Documentación Frontend (JS)
      run: jsdoc app/Views/ -r -d docs/js-api

    - name: Crear Index de Navegación
      run: |
        echo '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Panel de Documentación - Hotel Platinium</title><style>body{font-family:"Segoe UI",Tahoma,sans-serif;text-align:center;padding:50px;background:#1a1a1b;color:#f5f5f5;height:100vh;display:flex;flex-direction:column;justify-content:center;margin:0}h1{color:#d4af37;font-size:2.5rem;margin-bottom:30px}a{display:inline-block;margin:15px;padding:25px 40px;background:#2d2d2e;border:2px solid #d4af37;border-radius:12px;text-decoration:none;color:#f5f5f5;font-weight:bold;font-size:1.1rem;transition:all 0.3s ease;box-shadow:0 4px 15px rgba(0,0,0,0.3)}a:hover{background:#d4af37;color:#1a1a1b;transform:translateY(-5px);box-shadow:0 8px 25px rgba(212,175,55,0.4)}p{margin-top:40px;color:#888}</style></head><body><h1>Hotel Platinium - Documentation Center</h1><div><a href="./php-api/index.html">Backend Reference (PHP)</a><a href="./js-api/index.html">Frontend Logic (JS)</a></div><p>Generated via GitHub Actions & AI Documentation Engine</p></body></html>' > docs/index.html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'docs/'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
